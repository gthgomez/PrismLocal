# Prism Local (root project name: LlmHostFromDocs) — run Gradle FROM this directory.
# Correct:
#   cd C:\Workspace\Project_Android\PrismLocal
#   .\gradlew.bat --no-daemon :app:assembleDebug
#   .\gradlew.bat --no-daemon :app:testDebugUnitTest
# Wrong: running :app:* from Project_Android composite root (no root :app module).
# From composite root only:
#   .\PrismLocal\gradlew.bat -p PrismLocal --no-daemon :app:assembleDebug
#
# Release signing: set LLMHOST_RELEASE_* in ~/.gradle/gradle.properties or env
# (store file must point at PrismLocal/release/…, not the old LLMHostAndroid path).

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
# AGP 9 / Kotlin: do not add org.jetbrains.kotlin.android to app plugins (see PROJECT_CONTEXT.md)
android.nonTransitiveRClass=true
